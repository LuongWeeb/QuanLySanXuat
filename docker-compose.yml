services:
  wmsmes-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
    secrets:
      - mssql_sa_password
    volumes:
      - sqldata:/var/opt/mssql/data
      - ./docker/sql/entrypoint.sh:/opt/wmsmes/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/opt/wmsmes/entrypoint.sh"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          export SQLCMDPASSWORD="$$(cat /run/secrets/mssql_sa_password)" &&
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  wmsmes-provision:
    build:
      context: .
      dockerfile: Dockerfile
    image: wmsmes-web:local
    command: ["--provision-database"]
    environment:
      DatabaseProvisioning__Server: wmsmes-db
      DatabaseProvisioning__Database: WmsMesDb
      DatabaseProvisioning__SaUser: sa
      DatabaseProvisioning__SaPasswordFile: /run/secrets/mssql_sa_password
      DatabaseProvisioning__MigratorPasswordFile: /run/secrets/mssql_migration_password
      DatabaseProvisioning__ApplicationPasswordFile: /run/secrets/mssql_app_password
    secrets:
      - mssql_sa_password
      - mssql_migration_password
      - mssql_app_password
    depends_on:
      wmsmes-db:
        condition: service_healthy
    restart: "no"

  wmsmes-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: wmsmes-web:local
    command: ["--initialize-database"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Server: wmsmes-db
      Database__Name: WmsMesDb
      Database__User: wmsmes_migrator
      Database__PasswordFile: /run/secrets/mssql_migration_password
    secrets:
      - mssql_migration_password
    depends_on:
      wmsmes-provision:
        condition: service_completed_successfully
    restart: "no"

  wmsmes-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: wmsmes-web:local
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DatabaseInitialization__Enabled: "false"
      Database__Server: wmsmes-db
      Database__Name: WmsMesDb
      Database__User: wmsmes_app
      Database__PasswordFile: /run/secrets/mssql_app_password
      Jwt__SigningKeyFile: /run/secrets/jwt_signing_key
    secrets:
      - mssql_app_password
      - jwt_signing_key
    ports:
      - "5000:8080"
    depends_on:
      wmsmes-migrate:
        condition: service_completed_successfully

volumes:
  sqldata:

secrets:
  mssql_sa_password:
    file: "${MSSQL_SA_PASSWORD_FILE:?Set MSSQL_SA_PASSWORD_FILE in .env}"
  mssql_migration_password:
    file: "${MSSQL_MIGRATION_PASSWORD_FILE:?Set MSSQL_MIGRATION_PASSWORD_FILE in .env}"
  mssql_app_password:
    file: "${MSSQL_APP_PASSWORD_FILE:?Set MSSQL_APP_PASSWORD_FILE in .env}"
  jwt_signing_key:
    file: "${JWT_SIGNING_KEY_FILE:?Set JWT_SIGNING_KEY_FILE in .env}"
